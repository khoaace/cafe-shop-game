<!doctype html><html lang="vi"><meta charset="utf-8"><title>Phin góc phố · Trước / sau</title>
<style>body{margin:0;padding:28px;background:#203c32;color:#fff0d4;font:16px system-ui}h1{font-family:Georgia;font-size:30px}select,input{font:inherit;margin:8px}main{position:relative;width:min(100%,1280px);margin:20px auto;--cut:50%}img{display:block;width:100%}.after{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--cut)) 0 0)}main:after{content:'';position:absolute;top:0;bottom:0;left:var(--cut);border-left:2px solid #efc076}p{max-width:950px;line-height:1.6}a{color:#efc076}</style>
<h1>Phin góc phố · Đối chiếu hình ảnh</h1><p>Bên trái vạch: bản mới. Bên phải: bản cũ. Kéo để so sánh; chọn kích thước desktop và DPR đã chụp thực tế. Ảnh toàn màn hình có thể mở riêng để xem ở pixel gốc.</p>
<label>Kích thước <select id="size"><option>1366x768</option><option selected>1920x1080</option><option>2560x1440</option></select></label><label>DPR <select id="dpr"><option>1</option><option selected>2</option></select></label><label>Vạch so sánh <input id="slider" type="range" min="0" max="100" value="50"></label>
<p><a id="old" target="_blank">Mở ảnh trước</a> · <a id="new" target="_blank">Mở ảnh sau</a></p>
<main><img id="before" alt="Trước khi cải thiện"><img id="after" class="after" alt="Sau khi cải thiện"></main>
<script>const byId=id=>document.getElementById(id);function update(){for(const [phase,id,link] of [['before','before','old'],['after','after','new']]){const src=`sharp-${phase}-${byId('size').value}-dpr${byId('dpr').value}.png`;byId(id).src=src;byId(link).href=src;}}byId('size').onchange=byId('dpr').onchange=update;byId('slider').oninput=e=>document.querySelector('main').style.setProperty('--cut',e.target.value+'%');update();</script></html>
